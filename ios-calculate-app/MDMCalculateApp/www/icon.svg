<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <!-- Inner card shape -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4"/>
  <!-- Calculator Icon Symbol -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Calculator body -->
    <rect x="136" y="116" width="240" height="280" rx="28" fill="#ffffff"/>
    <!-- Screen -->
    <rect x="164" y="146" width="184" height="60" rx="12" fill="#047857"/>
    <!-- Screen digits representation -->
    <rect x="260" y="166" width="70" height="20" rx="6" fill="#a7f3d0"/>
    <!-- Buttons -->
    <circle cx="184" cy="245" r="16" fill="#e2e8f0"/>
    <circle cx="236" cy="245" r="16" fill="#e2e8f0"/>
    <circle cx="288" cy="245" r="16" fill="#e2e8f0"/>
    <circle cx="340" cy="245" r="16" fill="#f59e0b"/>

    <circle cx="184" cy="295" r="16" fill="#e2e8f0"/>
    <circle cx="236" cy="295" r="16" fill="#e2e8f0"/>
    <circle cx="288" cy="295" r="16" fill="#e2e8f0"/>
    <circle cx="340" cy="295" r="16" fill="#10b981"/>

    <circle cx="184" cy="345" r="16" fill="#e2e8f0"/>
    <circle cx="236" cy="345" r="16" fill="#e2e8f0"/>
    <circle cx="288" cy="345" r="16" fill="#e2e8f0"/>
    <circle cx="340" cy="345" r="16" fill="#059669"/>
  </g>
</svg>
