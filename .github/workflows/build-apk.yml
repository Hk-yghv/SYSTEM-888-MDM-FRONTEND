name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'android-calculate-app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

jobs:
  build-apk:
    name: Build Offline Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 🛠️ Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: 🏗️ Generate Wrapper and Build APK
        run: |
          cd android-calculate-app
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: 📦 Prepare APK Artifacts
        run: |
          mkdir -p release-apks
          find android-calculate-app/app/build/outputs/apk/ -name "*.apk" -exec cp {} release-apks/MDM-Calculate-Schedule-Offline.apk \;
          ls -la release-apks/

      - name: 🚀 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MDM-Calculate-Schedule-Offline-APK
          path: release-apks/*.apk
          retention-days: 30

