name: Build iOS App (IPA)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'ios-calculate-app/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

jobs:
  build-ios:
    name: Build iOS IPA & App Bundle
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: 🏗️ Build iOS App with Xcode
        run: |
          cd ios-calculate-app
          mkdir -p MDMCalculateApp/www
          cp -r www/* MDMCalculateApp/www/ 2>/dev/null || true
          xcodebuild clean build \
            -project MDMCalculate.xcodeproj \
            -scheme MDMCalculate \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 📦 Package iOS .IPA and Artifacts
        run: |
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          APP_DIR="$WORKSPACE_DIR/ios-calculate-app"
          RELEASE_DIR="$APP_DIR/release-ios"
          PRODUCTS_DIR="$APP_DIR/DerivedData/Build/Products/Release-iphoneos"
          
          mkdir -p "$APP_DIR/Payload" "$RELEASE_DIR"
          
          # 1. Copy .app into Payload folder for standard IPA packaging
          cp -r "$PRODUCTS_DIR/MDMCalculate.app" "$APP_DIR/Payload/"
          
          # 2. Create installable IPA from Payload
          cd "$APP_DIR"
          zip -r "$RELEASE_DIR/MDM-Calculate-Schedule-iOS.ipa" Payload
          
          # 3. Create raw .app zip
          cd "$PRODUCTS_DIR"
          zip -r "$RELEASE_DIR/MDMCalculate-App-Bundle.zip" MDMCalculate.app
          
          # 4. Create standalone Web/PWA zip for quick sharing
          cd "$APP_DIR"
          zip -r "$RELEASE_DIR/MDM-Calculate-PWA-WebClip.zip" www/
          
          ls -la "$RELEASE_DIR"

      - name: 🚀 Upload iOS IPA Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MDM-Calculate-Schedule-iOS-IPA
          path: ios-calculate-app/release-ios/*
          retention-days: 30
