<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Triangular Frame / Connector -->
  <polygon points="250,90 120,330 380,330" fill="none" stroke="#233544" stroke-width="42" stroke-linejoin="round" />

  <!-- Center Text -->
  <text x="250" y="310" text-anchor="middle" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="78" fill="#1e293b" letter-spacing="2">MDM</text>

  <!-- Top Circle: MOBILE (Orange) -->
  <g transform="translate(250, 140)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="82" fill="#ff9800" />
    <text x="0" y="-52" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="2">MOBILE</text>
    <!-- Smartphone Icon -->
    <rect x="-24" y="-38" width="48" height="84" rx="8" ry="8" fill="none" stroke="#ffffff" stroke-width="4.5" />
    <line x1="-16" y1="-26" x2="16" y2="-26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="34" r="5" fill="#ffffff" />
    <rect x="-18" y="-20" width="36" height="46" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Bottom Left Circle: DEVICE (Dark Blue) -->
  <g transform="translate(125, 375)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="82" fill="#0f4c75" />
    <text x="0" y="-52" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="2">DEVICE</text>
    <!-- Network Node Icon -->
    <rect x="-28" y="-12" width="18" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="3" />
    <rect x="10" y="-30" width="18" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="3" />
    <rect x="10" y="10" width="18" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="3" />
    <circle cx="-19" cy="-3" r="3" fill="#ffffff" />
    <circle cx="19" cy="-21" r="3" fill="#ffffff" />
    <circle cx="19" cy="19" r="3" fill="#ffffff" />
    <line x1="-10" y1="-3" x2="10" y2="-21" stroke="#ffffff" stroke-width="3" />
    <line x1="-10" y1="-3" x2="10" y2="19" stroke="#ffffff" stroke-width="3" />
    <line x1="19" y1="-12" x2="19" y2="10" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Bottom Right Circle: MANAGEMENT (Red/Coral) -->
  <g transform="translate(375, 375)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="82" fill="#ff4d4d" />
    <text x="0" y="-52" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="1.5">MANAGEMENT</text>
    <!-- Gear Icons -->
    <g transform="translate(-14, 8)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-dasharray="10 4" />
      <circle cx="0" cy="0" r="9" fill="none" stroke="#ffffff" stroke-width="4" />
    </g>
    <g transform="translate(18, -12)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="8 3" />
      <circle cx="0" cy="0" r="6" fill="none" stroke="#ffffff" stroke-width="3" />
    </g>
  </g>
</svg>
