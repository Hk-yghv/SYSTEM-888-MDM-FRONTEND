<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" id="app-viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      function adjustDesktopViewport() {
        var minWidth = 1200;
        var screenW = window.screen.width;
        var meta = document.getElementById('app-viewport') || document.querySelector('meta[name="viewport"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.id = 'app-viewport';
          document.head.appendChild(meta);
        }
        if (screenW < minWidth) {
          var initialScale = (screenW / minWidth).toFixed(4);
          meta.setAttribute('content', 'width=' + minWidth + ', initial-scale=' + initialScale + ', minimum-scale=0.2, maximum-scale=4.0, user-scalable=yes');
        } else {
          meta.setAttribute('content', 'width=device-width, initial-scale=1.0');
        }
      }
      adjustDesktopViewport();
      window.addEventListener('resize', adjustDesktopViewport);
      window.addEventListener('orientationchange', function () {
        setTimeout(adjustDesktopViewport, 200);
      });
    })();
  </script>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#059669" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SYSTEM MDM" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <base href="/">
  <script>
    window.deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.deferredPwaPrompt = e;
    });
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script>
    window.addEventListener('error', function (e) {
      if (e && (e.message && (e.message.indexOf('Failed to load module script') !== -1 || e.message.indexOf('Importing a module script failed') !== -1))) {
        var hasReloaded = sessionStorage.getItem('auto_reloaded_for_new_version');
        if (!hasReloaded) {
          sessionStorage.setItem('auto_reloaded_for_new_version', 'true');
          window.location.reload(true);
        }
      }
    }, true);
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./src/routes/main.jsx"></script>
</body>

</html>
